<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumberland Dukes U15 - Hockey Pool</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f32;
            --card-border: #23314d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #e11d48;
            --accent-red-hover: #be123c;
            --gold: #f59e0b;
            --silver: #cbd5e1;
            --bronze: #d97706;
            --green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, #1e293b 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--card-border);
            padding: 2.5rem 1rem 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        header p {
            color: var(--accent-red);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.95rem;
        }

        /* Countdown Timer */
        .countdown-container {
            margin: 1.5rem auto 0 auto;
            background: rgba(225, 29, 72, 0.1);
            border: 1px solid rgba(225, 29, 72, 0.3);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: inline-block;
            max-width: 90%;
        }

        .countdown-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .countdown-clock {
            display: flex;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }

        .clock-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .clock-num {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            line-height: 1;
        }

        .clock-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .clock-sep {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--accent-red);
        }

        .container {
            max-width: 950px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .btn {
            background-color: var(--accent-red);
            color: white;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background-color: var(--accent-red-hover);
            transform: translateY(-1px);
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-input {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
            max-width: 280px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
        }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background-color: #111827;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .rank-badge {
            font-weight: 800;
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.05);
        }

        .rank-1 { background: var(--gold); color: #000; }
        .rank-2 { background: var(--silver); color: #000; }
        .rank-3 { background: var(--bronze); color: #fff; }

        .points-cell {
            font-weight: 800;
            font-size: 1.1rem;
            color: #ffffff;
            text-align: right;
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        /* Sponsors */
        .sponsors-section {
            text-align: center;
            margin-top: 1rem;
        }

        .sponsors-section h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        .sponsors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.25rem;
        }

        .sponsor-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1rem;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .sponsor-card:hover {
            border-color: var(--accent-red);
            transform: translateY(-2px);
        }

        .sponsor-card img {
            max-width: 100%;
            max-height: 65px;
            object-fit: contain;
            filter: brightness(0.95);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--card-border);
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cumberland Dukes U15</h1>
        <p>Official Hockey Box Pool</p>

        <div class="countdown-container">
            <div class="countdown-title">Draft / Entry Deadline</div>
            <div class="countdown-clock" id="countdown">
                <div class="clock-unit"><span class="clock-num" id="d">00</span><span class="clock-label">Days</span></div>
                <div class="clock-sep">:</div>
                <div class="clock-unit"><span class="clock-num" id="h">00</span><span class="clock-label">Hours</span></div>
                <div class="clock-sep">:</div>
                <div class="clock-unit"><span class="clock-num" id="m">00</span><span class="clock-label">Mins</span></div>
                <div class="clock-sep">:</div>
                <div class="clock-unit"><span class="clock-num" id="s">00</span><span class="clock-label">Secs</span></div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <div>
                    <h2 style="font-size: 1.25rem;">Live Leaderboard</h2>
                </div>
                <a href="https://docs.google.com/spreadsheets/d/1Qo-KkRGbshhKZMyyVL4xbhjcfPCrdNQ4YoVePAd5AuA/edit?usp=drivesdk" class="btn" target="_blank">
                    Open Google Sheet ↗
                </a>
            </div>

            <div class="controls-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search participant..." onkeyup="filterTable()">
                <div class="status-badge">
                    <span class="dot"></span>
                    <span id="lastUpdated">Live Standings</span>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="leaderboard">
                    <thead>
                        <tr>
                            <th style="width: 70px;">Rank</th>
                            <th>Participant Name</th>
                            <th style="text-align: right; width: 120px;">Total Points</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="3" class="loading-state">Loading live standings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="sponsors-section">
            <h3>Proudly Sponsored By</h3>
            <div class="sponsors-grid">
                <div class="sponsor-card">
                    <img src="images/toprankin.png" alt="TopRankin Mortgages" onerror="this.onerror=null; this.src='images/sponsor1.png';">
                </div>
                <div class="sponsor-card">
                    <img src="images/applehvac.png" alt="Apple HVAC" onerror="this.onerror=null; this.src='images/sponsor2.png';">
                </div>
                <div class="sponsor-card">
                    <img src="images/plumbing.png" alt="A Helping Hand Plumbing" onerror="this.onerror=null; this.src='images/sponsor3.png';">
                </div>
                <div class="sponsor-card">
                    <img src="images/butcher.png" alt="Around the Block Meat Market" onerror="this.onerror=null; this.src='images/sponsor4.png';">
                </div>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Cumberland Dukes U15 Hockey Pool
    </footer>

    <script>
        const sheetId = '1Qo-KkRGbshhKZMyyVL4xbhjcfPCrdNQ4YoVePAd5AuA';
        const sheetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv`;

        let allData = [];

        async function fetchStandings() {
            try {
                const response = await fetch(sheetUrl);
                const csvText = await response.text();
                parseCSV(csvText);
            } catch (error) {
                console.error("Error fetching sheet:", error);
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="3" class="error-state">
                            Unable to auto-load live standings.<br>
                            <a href="https://docs.google.com/spreadsheets/d/${sheetId}/edit?usp=drivesdk" target="_blank" style="color:var(--accent-red); margin-top:0.5rem; inline-block;">Click here to view directly on Google Sheets</a>
                        </td>
                    </tr>`;
            }
        }

        function parseCSV(csv) {
            const lines = csv.split('\n');
            const rows = [];

            for (let i = 0; i < lines.length; i++) {
                const cleanLine = lines[i].replace(/\r/g, '');
                if (!cleanLine.trim()) continue;
                
                // Parse CSV line taking quotes into account
                const matches = cleanLine.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || cleanLine.split(',');
                const cleanCols = matches.map(cell => cell.replace(/^"|"$/g, '').trim());
                rows.push(cleanCols);
            }

            // Extract participant rows (handling title/header rows dynamically)
            allData = [];
            rows.forEach((row) => {
                if (row.length >= 2) {
                    const name = row[0] || row[1];
                    const pts = parseInt(row[row.length - 1], 10);

                    if (name && !isNaN(pts) && !name.toLowerCase().includes('rank') && !name.toLowerCase().includes('total')) {
                        allData.push({ name: name, points: pts });
                    }
                }
            });

            // Sort descending by points
            allData.sort((a, b) => b.points - a.points);
            renderTable(allData);
            
            const now = new Date();
            document.getElementById('lastUpdated').innerText = `Updated ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="loading-state">No standings data found.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((item, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                return `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${rank}</span></td>
                        <td style="font-weight: 600;">${item.name}</td>
                        <td class="points-cell">${item.points}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        // Countdown Timer Logic to Target Monday 10:00 PM EST
        function getTargetDeadline() {
            const now = new Date();
            let target = new Date();
            
            // Find next Monday
            const dayOfWeek = now.getDay(); // 0 = Sun, 1 = Mon, ...
            let daysUntilMonday = (1 - dayOfWeek + 7) % 7;
            
            // If today is Monday and it's already past 10 PM EST (22:00), target next Monday
            target.setDate(now.getDate() + daysUntilMonday);
            target.setHours(22, 0, 0, 0); // 10:00:00 PM

            if (now > target) {
                target.setDate(target.getDate() + 7);
            }
            return target;
        }

        const deadline = getTargetDeadline();

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = deadline.getTime() - now;

            if (distance < 0) {
                document.getElementById('countdown').innerHTML = "<div style='color:var(--accent-red); font-weight:900;'>DRAFT CLOSED</div>";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('d').innerText = String(days).padStart(2, '0');
            document.getElementById('h').innerText = String(hours).padStart(2, '0');
            document.getElementById('m').innerText = String(minutes).padStart(2, '0');
            document.getElementById('s').innerText = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Initial Load
        fetchStandings();
    </script>
</body>
</html>
