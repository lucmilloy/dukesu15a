<script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTvvppojZlQI-3QTow7yD7XhnTj-Dq40I8mOrWLHiXPAEJrYnTIap6Kj4R0IHoEQ9WQsjisUwlZwn60/pub?gid=2014613418&single=true&output=csv';

    // Robust CSV parser that handles commas inside quoted fields
    function parseCSVLine(text) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += char;
        }
      }
      result.push(current.trim());
      return result;
    }

    async function fetchLeaderboard() {
      try {
        const response = await fetch(CSV_URL);
        const data = await response.text();
        const lines = data.split('\n');
        
        const tbody = document.querySelector('#leaderboard tbody');
        tbody.innerHTML = '';

        let rank = 1;
        for (let i = 1; i < lines.length; i++) {
          if (!lines[i].trim()) continue;
          const cols = parseCSVLine(lines[i]);
          
          // Debugging: check your browser console (F12) to see what row data is read
          console.log(`Row ${i}:`, cols);

          // Change indices here if your data is in different columns 
          // (Index 0 = Col A, Index 1 = Col B, Index 2 = Col C, etc.)
          const name = cols[3] ? cols[3].replace(/"/g, '') : (cols[0] ? cols[0].replace(/"/g, '') : '');
          const pts = cols[4] ? cols[4].replace(/"/g, '') : (cols[1] ? cols[1].replace(/"/g, '') : '0');

          if (name && name !== 'Participant Name' && name !== 'Sorted Name') {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="rank">${rank++}</td>
              <td>${name}</td>
              <td class="points">${pts || '0'}</td>
            `;
            tbody.appendChild(tr);
          }
        }
      } catch (err) {
        console.error('Error fetching leaderboard:', err);
        document.querySelector('#leaderboard tbody').innerHTML = `<tr><td colspan="3" style="text-align:center; color:red;">Unable to load standings. Check CSV URL.</td></tr>`;
      }
    }

    fetchLeaderboard();
  </script>
