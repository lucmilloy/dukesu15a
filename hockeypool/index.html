<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumberland Dukes U15 - Hockey Pool</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #161f32;
            --card-border: #23314d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #e11d48;
            --accent-red-hover: #be123c;
            --gold: #f59e0b;
            --silver: #cbd5e1;
            --bronze: #d97706;
            --green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(180deg, #1e293b 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--card-border);
            padding: 2.5rem 1rem 2rem 1rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 0.4rem;
        }

        header p {
            color: var(--accent-red);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.95rem;
        }

        .container {
            max-width: 950px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-input {
            background: #0b0f19;
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
            max-width: 280px;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-red);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            background-color: #111827;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 700;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .rank-badge {
            font-weight: 800;
            display: inline-block;
            width: 28px;
            height: 28px;
            line-height: 28px;
            text-align: center;
            border-radius: 50%;
            font-size: 0.85rem;
            background: rgba(255,255,255,0.05);
        }

        .rank-1 { background: var(--gold); color: #000; }
        .rank-2 { background: var(--silver); color: #000; }
        .rank-3 { background: var(--bronze); color: #fff; }

        .points-cell {
            font-weight: 800;
            font-size: 1.1rem;
            color: #ffffff;
            text-align: right;
        }

        .loading-state, .error-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        /* Sponsors */
        .sponsors-section {
            text-align: center;
            margin-bottom: 2rem;
        }

        .sponsors-section h3 {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 1.25rem;
            font-weight: 700;
        }

        .sponsors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.25rem;
        }

        .sponsor-card {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 1rem;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .sponsor-card:hover {
            border-color: var(--accent-red);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.15);
        }

        .sponsor-card img {
            max-width: 100%;
            max-height: 65px;
            object-fit: contain;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid var(--card-border);
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cumberland Dukes U15</h1>
        <p>Official Hockey Box Pool</p>
    </header>

    <div class="container">
        <!-- Sponsors moved to the top -->
        <div class="sponsors-section">
            <h3>Proudly Sponsored By</h3>
            <div class="sponsors-grid">
                <a href="https://rizklawoffice.ca/" class="sponsor-card" target="_blank" title="Rizk Law">
                    <img src="../images/Rizk Law.png" alt="Rizk Law">
                </a>
                <a href="https://toprankinmortgages.com/" class="sponsor-card" target="_blank" title="Top Rankin Mortgages">
                    <img src="../images/newtoprankin.png" alt="Top Rankin Mortgages">
                </a>
                <a href="https://applehvac.ca/" class="sponsor-card" target="_blank" title="Apple HVAC">
                    <img src="../images/apple.png" alt="Apple HVAC">
                </a>
                <a href="https://www.facebook.com/p/A-Helping-Hand-Residential-plumbing-services-100083300259407/" class="sponsor-card" target="_blank" title="A Helping Hand Residential Plumbing Services">
                    <img src="../images/helpinghang.jpg" alt="A Helping Hand Residential Plumbing Services">
                </a>
                <a href="https://www.bookkeepingbureau.ca/" class="sponsor-card" target="_blank" title="Book Keeping Bureau">
                    <img src="../images/bookkeeping.png" alt="Book Keeping Bureau">
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div>
                    <h2 style="font-size: 1.25rem;">Live Leaderboard</h2>
                </div>
            </div>

            <div class="controls-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="Search participant..." onkeyup="filterTable()">
                <div class="status-badge">
                    <span class="dot"></span>
                    <span id="lastUpdated">Live Standings</span>
                </div>
            </div>

            <div class="table-wrapper">
                <table id="leaderboard">
                    <thead>
                        <tr>
                            <th style="width: 70px;">Rank</th>
                            <th>Participant Name</th>
                            <th style="text-align: right; width: 120px;">Total Points</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="3" class="loading-state">Loading live standings...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Cumberland Dukes U15 Hockey Pool
    </footer>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTvvppojZlQI-3QTow7yD7XhnTj-Dq40I8mOrWLHiXPAEJrYnTIap6Kj4R0IHoEQ9WQsjisUwlZwn60/pub?gid=2014613418&single=true&output=csv';

        let allData = [];

        async function fetchStandings() {
            try {
                const response = await fetch(csvUrl);
                if (!response.ok) throw new Error("Network response was not ok");
                const text = await response.text();
                parseCsvData(text);
            } catch (error) {
                console.error("Error fetching CSV sheet:", error);
                loadFallbackData();
            }
        }

        function loadFallbackData() {
            const rawList = [
                { name: "Nicolas Milloy", points: 65 },
                { name: "Ethan Lylyk", points: 65 },
                { name: "Holden Gubb", points: 61 },
                { name: "Graham Dotzko", points: 55 },
                { name: "Coach Luc", points: 0 },
                { name: "William Reynaert", points: 0 },
                { name: "Keenan McMullin", points: 0 },
                { name: "Jackson Desjardins", points: 0 },
                { name: "Charles Newark", points: 0 },
                { name: "Nathaniel Tsang", points: 0 },
                { name: "Loïk Taillefer", points: 0 },
                { name: "Max Ikura", points: 0 },
                { name: "Vincent Monette", points: 0 },
                { name: "Phénix Macdonell", points: 0 },
                { name: "Zayn Ismail", points: 0 },
                { name: "James Smith", points: 0 },
                { name: "Liam Villeneuve", points: 0 },
                { name: "Coach Corey", points: 0 },
                { name: "Coach Dave", points: 0 },
                { name: "Coach Jon D", points: 0 },
                { name: "Coach Jon R", points: 0 }
            ];
            allData = rawList;
            renderTable(allData);
            document.getElementById('lastUpdated').innerText = "Live Leaderboard Loaded (Fallback)";
        }

        function parseCSVLine(text) {
            let result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current.trim());
            return result.map(val => val.replace(/^"|"$/g, ''));
        }

        function parseCsvData(csvText) {
            allData = [];
            const lines = csvText.split('\n');
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const cols = parseCSVLine(line);
                if (cols.length < 2) continue;

                const col0 = cols[0];
                const col1 = cols[1];
                const lastCol = cols[cols.length - 1];

                let name = col0;
                let pts = parseInt(lastCol, 10);

                if (/^\d+$/.test(col0) && col1) {
                    name = col1;
                }

                const isHeader = !name || 
                    name.toLowerCase().includes('participant') || 
                    name.toLowerCase().includes('total points') || 
                    name.toLowerCase().includes('rank') ||
                    isNaN(pts);

                if (!isHeader && name) {
                    allData.push({ name: name, points: pts });
                }
            }

            if (allData.length === 0) {
                loadFallbackData();
                return;
            }

            allData.sort((a, b) => b.points - a.points);
            renderTable(allData);
            
            const now = new Date();
            document.getElementById('lastUpdated').innerText = `Updated ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="loading-state">No standings data found.</td></tr>`;
                return;
            }

            tbody.innerHTML = data.map((item, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                return `
                    <tr>
                        <td><span class="rank-badge ${rankClass}">${rank}</span></td>
                        <td style="font-weight: 600;">${item.name}</td>
                        <td class="points-cell">${item.points}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allData.filter(item => item.name.toLowerCase().includes(query));
            renderTable(filtered);
        }

        // Initial Fetch
        fetchStandings();
    </script>
</body>
</html>
