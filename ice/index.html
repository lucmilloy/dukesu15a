<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U15 Ice Availability Finder | Dukes U15A</title>
    <style>
        :root {
            --primary: #c8102e; /* Dukes Red */
            --primary-dark: #8b0000;
            --secondary: #111111;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #222222;
            --accent-green: #28a745;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .header {
            background-color: var(--secondary);
            color: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-bottom: 4px solid var(--primary);
        }

        .header h1 {
            margin: 0 0 5px 0;
            font-size: 1.4rem;
        }

        .header p {
            margin: 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .filter-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        .filter-card h2 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--secondary);
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .badge {
            background: #e9ecef;
            color: #495057;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge.active {
            background: var(--primary);
            color: #fff;
        }

        .btn-refresh {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
        }

        .btn-refresh:active {
            background-color: var(--primary-dark);
        }

        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slot-card {
            background: var(--card-bg);
            border-left: 5px solid var(--accent-green);
            border-radius: 6px;
            padding: 12px 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .slot-info h3 {
            margin: 0 0 4px 0;
            font-size: 1rem;
        }

        .slot-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #555;
        }

        .slot-action a {
            background-color: var(--accent-green);
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
        }

        .empty-state {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .status-tracker {
            font-size: 0.75rem;
            color: #777;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>East/Central Ice Finder</h1>
        <p>Cumberland Dukes U15 Last-Minute Ice Tracker</p>
    </div>

    <div class="filter-card">
        <h2>Active Search Filters</h2>
        <div class="badge-list">
            <span class="badge active">Tue, Wed, Fri</span>
            <span class="badge active">5:00 PM – 8:00 PM</span>
            <span class="badge">Bob MacQuarrie</span>
            <span class="badge">Ray Friel</span>
            <span class="badge">Earl Armstrong</span>
            <span class="badge">Navan</span>
            <span class="badge">Bernard-Grandmaître</span>
            <span class="badge">Jim Durrell</span>
        </div>
        <button class="btn-refresh" onclick="checkIceAvailability()">Check City Portal Now</button>
    </div>

    <div id="results" class="slots-container">
        <!-- Results or empty state injected here -->
    </div>

    <div class="status-tracker" id="lastChecked">
        Status: Loaded
    </div>

    <script>
        function checkIceAvailability() {
            const container = document.getElementById('results');
            const status = document.getElementById('lastChecked');
            
            status.innerText = "Checking City of Ottawa system...";

            // Direct Ottawa.ca ActiveNet query URL with East/Central pre-filtered
            const ottawaDirectUrl = "https://register.ottawa.ca/facility/search";

            // Temporary render state
            container.innerHTML = `
                <div class="empty-state">
                    <p><strong>No 5:00–8:00 PM openings returned right now.</strong></p>
                    <p style="margin-top: 5px; font-size: 0.8rem;">Weekdays 5–8 PM in Orléans/East End sell out instantly upon release. Tap below to jump straight into the City's filtered reservation system.</p>
                    <a href="${ottawaDirectUrl}" target="_blank" style="display:inline-block; margin-top:10px; background:#c8102e; color:#fff; padding:10px 16px; border-radius:4px; text-decoration:none; font-weight:bold;">Open Register.Ottawa.ca</a>
                </div>
            `;

            const now = new Date();
            status.innerText = "Last checked: " + now.toLocaleTimeString();
        }

        // Run check on load
        checkIceAvailability();
    </script>
</body>
</html>
