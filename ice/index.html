<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>East Ottawa Last-Minute Ice Finder</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 16px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin: 10px 0 4px 0;
    }
    p.subtitle {
      text-align: center;
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }
    .iframe-wrapper {
      position: relative;
      width: 100%;
      height: 75vh;
      min-height: 600px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .quick-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .quick-bar span {
      font-size: 0.9rem;
      color: #cbd5e1;
    }
    .portal-btn {
      background: #0284c7;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .portal-btn:hover {
      background: #0369a1;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>East Ottawa Last-Minute Ice Finder</h1>
  <p class="subtitle">Live availability directly from the City of Ottawa portal</p>

  <div class="quick-bar">
    <span><strong>Target Arenas:</strong> Bob MacQuarrie, Ray Friel, Earl Armstrong, Navan, Grandmaître, St-Laurent, Canterbury, Lois Kemp, Cumberland</span>
    <a href="https://ca.apm.activecommunities.com/ottawa/Reserve_Options" target="_blank" rel="noopener" class="portal-btn">Open Full Screen ↗</a>
  </div>

  <div class="iframe-wrapper">
    <iframe src="https://ca.apm.activecommunities.com/ottawa/Reserve_Options" title="City of Ottawa Last Minute Ice Portal"></iframe>
  </div>
</div>

</body>
</html>
