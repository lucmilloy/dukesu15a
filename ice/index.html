<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>East Ottawa Ice Finder | Cumberland Dukes</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Navigation Header -->
    <div class="flex items-center justify-between">
      <a href="../" class="text-xs text-sky-400 hover:text-sky-300 font-semibold flex items-center gap-1 transition">
        ← Back to Team Homepage
      </a>
      <span id="update-status" class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">
        Checking status...
      </span>
    </div>

    <!-- Main Title Block -->
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-extrabold text-white tracking-tight">East Ottawa Ice Finder</h1>
      <p class="text-slate-400 text-sm mt-1">
        Automated tracking for last-minute municipal ice openings in Orléans, Gloucester, and surrounding East Ottawa arenas.
      </p>
    </header>

    <!-- Filter Controls -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-slate-800/80 p-4 rounded-xl border border-slate-700/80 shadow-lg">
      
      <!-- Facility Filter -->
      <div>
        <label for="facility-filter" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Arena / Facility</label>
        <select id="facility-filter" onchange="renderSlots()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition">
          <option value="ALL">All East Ottawa Arenas</option>
          <option value="Bob MacQuarrie">Bob MacQuarrie (Orléans)</option>
          <option value="Ray Friel">Ray Friel Recreation Complex</option>
          <option value="Earl Armstrong">Earl Armstrong Arena</option>
          <option value="Navan">Navan Memorial Centre</option>
          <option value="Bernard-Grandmaître">Bernard-Grandmaître</option>
          <option value="Canterbury">Canterbury Arena</option>
          <option value="Lois Kemp">Lois Kemp Arena (Blackburn)</option>
          <option value="Cumberland">Cumberland Community Centre</option>
        </select>
      </div>

      <!-- Time Range Filter -->
      <div>
        <label for="time-filter" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Time Slot</label>
        <select id="time-filter" onchange="renderSlots()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition">
          <option value="ALL">Any Time</option>
          <option value="PRIME">Prime Time (5:00 PM – 10:00 PM)</option>
          <option value="DAY">Daytime (Before 5:00 PM)</option>
          <option value="LATE">Late Night (After 10:00 PM)</option>
        </select>
      </div>

      <!-- Keyword Search -->
      <div>
        <label for="search-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Keyword Search</label>
        <input id="search-input" type="text" oninput="renderSlots()" placeholder="e.g. Rink A, Elizabeth Manley..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 placeholder-slate-500 transition">
      </div>

      <!-- Sorting -->
      <div>
        <label for="sort-order" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Sort Results By</label>
        <select id="sort-order" onchange="renderSlots()" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition">
          <option value="DATE_ASC">Date & Time (Earliest First)</option>
          <option value="PRICE_ASC">Price (Lowest First)</option>
        </select>
      </div>

    </div>

    <!-- Status Bar -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center text-sm text-slate-400 gap-2">
      <span id="slot-count" class="font-medium text-slate-300">Loading ice availability...</span>
      <a href="https://ca.apm.activecommunities.com/ottawa/" target="_blank" rel="noopener noreferrer" class="text-xs text-sky-400 hover:text-sky-300 underline inline-flex items-center gap-1">
        City of Ottawa Recreation Portal ↗
      </a>
    </div>

    <!-- Ice Cards Grid -->
    <div id="slots-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

  </div>

  <script>
    let iceData = [];

    async function init() {
      const statusEl = document.getElementById('update-status');
      try {
        // Fetch from ice_data.json residing in the same directory
        const res = await fetch('./ice_data.json', { cache: 'no-store' });
        if (!res.ok) throw new Error("File not found");
        const json = await res.json();
        
        iceData = json.slots || [];
        
        if (json.last_updated) {
          const updatedDate = new Date(json.last_updated);
          const formattedTime = updatedDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const formattedDate = updatedDate.toLocaleDateString([], { month: 'short', day: 'numeric' });
          statusEl.innerText = `Updated ${formattedDate} at ${formattedTime}`;
          statusEl.className = "text-xs bg-emerald-950/80 text-emerald-400 px-3 py-1 rounded-full border border-emerald-800/80 font-medium";
        } else {
          statusEl.innerText = "Data loaded";
          statusEl.className = "text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-700";
        }
      } catch (e) {
        statusEl.innerText = "Offline / No Data Saved";
        statusEl.className = "text-xs bg-amber-950/80 text-amber-400 px-3 py-1 rounded-full border border-amber-800/80 font-medium";
      }
      renderSlots();
    }

    function parseHour(timeStr) {
      if (!timeStr) return 0;
      const clean = timeStr.trim().toUpperCase();
      const match = clean.match(/(\d+):(\d+)\s*(AM|PM)?/);
      if (!match) return 0;
      let hours = parseInt(match[1], 10);
      const modifier = match[3];
      if (modifier === 'PM' && hours < 12) hours += 12;
      if (modifier === 'AM' && hours === 12) hours = 0;
      return hours;
    }

    function renderSlots() {
      const facility = document.getElementById('facility-filter').value;
      const timeRange = document.getElementById('time-filter').value;
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      const sortOrder = document.getElementById('sort-order').value;
      const grid = document.getElementById('slots-grid');

      let filtered = iceData.filter(s => {
        // Facility filter
        if (facility !== 'ALL' && !s.facility.toLowerCase().includes(facility.toLowerCase())) {
          return false;
        }

        // Search Query filter
        if (searchQuery) {
          const matchFac = (s.facility || '').toLowerCase().includes(searchQuery);
          const matchRink = (s.rink || '').toLowerCase().includes(searchQuery);
          const matchDate = (s.date || '').toLowerCase().includes(searchQuery);
          if (!matchFac && !matchRink && !matchDate) return false;
        }

        // Time Range filter
        if (s.startTime && timeRange !== 'ALL') {
          const hour = parseHour(s.startTime);
          if (timeRange === 'PRIME' && (hour < 17 || hour >= 22)) return false;
          if (timeRange === 'DAY' && hour >= 17) return false;
          if (timeRange === 'LATE' && hour < 22) return false;
        }

        return true;
      });

      // Sorting
      if (sortOrder === 'DATE_ASC') {
        filtered.sort((a, b) => {
          const dateA = new Date(`${a.date || '1970-01-01'} ${a.startTime || '00:00'}`);
          const dateB = new Date(`${b.date || '1970-01-01'} ${b.startTime || '00:00'}`);
          return dateA - dateB;
        });
      } else if (sortOrder === 'PRICE_ASC') {
        filtered.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0));
      }

      document.getElementById('slot-count').innerText = `Showing ${filtered.length} available East Ottawa ice slot${filtered.length === 1 ? '' : 's'}`;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-12 px-4 bg-slate-800/40 rounded-xl border border-slate-800 text-slate-400">
            <p class="text-base font-semibold text-slate-300">No matching ice slots found</p>
            <p class="text-xs text-slate-500 mt-1">Try clearing your filters or check back later after the next automated scan.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(s => {
        const formattedPrice = s.price ? `$${parseFloat(s.price).toFixed(2)}` : 'Contact Facility';
        const displayRink = s.rink && s.rink !== s.facility ? s.rink : 'Main Rink';
        const bookingLink = s.directUrl || 'https://ca.apm.activecommunities.com/ottawa/';

        return `
          <div class="bg-slate-800 border border-slate-700/80 hover:border-sky-500/60 rounded-xl p-5 transition flex flex-col justify-between shadow-sm hover:shadow-sky-950/30">
            <div>
              <div class="flex justify-between items-start gap-2">
                <span class="text-xs font-semibold text-sky-300 bg-sky-950/80 border border-sky-800/60 px-2.5 py-1 rounded-md">
                  ${displayRink}
                </span>
                <span class="text-lg font-bold text-emerald-400 tracking-tight">
                  ${formattedPrice}
                </span>
              </div>
              
              <h3 class="font-bold text-slate-100 text-lg mt-3 leading-snug">${s.facility}</h3>
              
              <div class="mt-3 space-y-1 text-sm text-slate-300">
                <p class="flex items-center gap-2">
                  <span class="text-slate-400">📅</span>
                  <span class="font-medium">${s.date || 'Date N/A'}</span>
                </p>
                <p class="flex items-center gap-2 text-slate-400">
                  <span>⏰</span>
                  <span>${s.startTime || ''} ${s.endTime ? '– ' + s.endTime : ''} (${s.duration || 60} mins)</span>
                </p>
              </div>
            </div>

            <div class="mt-5 pt-3 border-t border-slate-700/50">
              <a href="${bookingLink}" target="_blank" rel="noopener noreferrer" class="block w-full text-center bg-sky-600 hover:bg-sky-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow">
                Book on City of Ottawa ↗
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    init();
  </script>
</body>
</html>
